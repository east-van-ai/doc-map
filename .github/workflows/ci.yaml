name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest]
        include:
          # the floor is the Mac's stock 3.9, which setup-python ships no further than 24.04
          - python-version: "3.9"
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        # the pip upgrade is load-bearing: --group needs pip 25.1 or newer
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Run tests
        run: pytest

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

  # every run builds, so a branch push proves the package before any tag
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # a full version: setup-uv publishes no major tag after v7
      - uses: astral-sh/setup-uv@v10.3.2

      - name: Build
        run: uv build
