[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[project]
name = "doc-map"
version = "0.4.1"
description = "Walk a Python project and emit a YAML manifest of every function and class, paired with its first docstring sentence."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Go Nakamaru" }]
keywords = ["cli", "ast", "documentation", "codebase-mapping"]
dependencies = []
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
]

# Local tooling, never shipped. A dependency group stays out of the wheel and
# off PyPI, which an optional-dependencies extra would not. `uv sync` installs
# it by default; CI uses `pip install -e . --group dev` (needs pip 25.1+). The
# ruff pin is exact on purpose: it freezes both the linter's default rule set
# and the formatter's style.
[dependency-groups]
dev = [
    "pytest",
    "ruff==0.16.0",
]

[project.urls]
Repository = "https://github.com/east-van-ai/doc-map"
Changelog = "https://github.com/east-van-ai/doc-map/blob/main/CHANGELOG.md"

[project.scripts]
doc-map = "doc_map.cli:main"

[tool.pytest.ini_options]
# Capture at the sys level, not the file descriptor level. fd capture
# intercepts descriptors 1 and 2, which a child process inherits, so it
# changes what the subprocess-based integration tests actually see.
# Deliberate, and kept.
addopts = "--capture=sys"
testpaths = ["tests"]